
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campuscart
      POSTGRES_USER: campuscart
      POSTGRES_PASSWORD: campuscart
    ports:
      - "5433:5432"
    volumes:
      - campuscart_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuscart -d campuscart"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - campuscart_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    volumes:
      - campuscart_uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+psycopg://campuscart:campuscart@db:5432/campuscart
      REDIS_URL: redis://redis:6379/0
      SALEOR_API_URL: http://host.docker.internal:8000/graphql/
      SALEOR_CHANNEL: default-channel
      JWT_SECRET: ${JWT_SECRET:-REPLACE_WITH_LOCAL_DEV_JWT_SECRET_CHANGE_BEFORE_PROD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      APP_ENV: ${APP_ENV:-development}
      DEV_OTP_ECHO: ${DEV_OTP_ECHO:-true}
      OTP_TTL_SECONDS: "600"
      OTP_MAX_ATTEMPTS: "5"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@campuscart.local}
      SMTP_STARTTLS: "true"
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      HANDOFF_SECRET: ${HANDOFF_SECRET:-REPLACE_WITH_LOCAL_DEV_HANDOFF_SECRET_CHANGE_BEFORE_PROD}
      PASSWORD_RESET_TTL_SECONDS: "900"
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-local}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-YOUR_RAZORPAY_TEST_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-YOUR_RAZORPAY_TEST_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-YOUR_RAZORPAY_WEBHOOK_SECRET}
      CAMPUS_VERIFICATION_MODE: ${CAMPUS_VERIFICATION_MODE:-domain_or_admin}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      MEDIA_DIR: ${MEDIA_DIR:-/app/uploads}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8100"]
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://campuscart:campuscart@db:5432/campuscart
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-REPLACE_WITH_LOCAL_DEV_JWT_SECRET_CHANGE_BEFORE_PROD}
      HANDOFF_SECRET: ${HANDOFF_SECRET:-REPLACE_WITH_LOCAL_DEV_HANDOFF_SECRET_CHANGE_BEFORE_PROD}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8100
      CAMPUSCART_INTERNAL_API_URL: http://backend:8100
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  campuscart_db:
  campuscart_redis:
  campuscart_uploads:
